[package]
name = "dcgm"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "dcgm"
releases-url = "https://github.com/NVIDIA/DCGM/releases"

